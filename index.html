<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Legacy App - Calculadora y To-Do</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <h1>Legacy App - Calculadora y Lista de Tareas</h1>

  <section id="calculadora">
    <h2>Calculadora</h2>
    <div class="calc-container">
      <input type="text" id="display" readonly />
      <div class="buttons">
        <button class="btn" data-value="7">7</button>
        <button class="btn" data-value="8">8</button>
        <button class="btn" data-value="9">9</button>
        <button class="btn" data-value="/">÷</button>

        <button class="btn" data-value="4">4</button>
        <button class="btn" data-value="5">5</button>
        <button class="btn" data-value="6">6</button>
        <button class="btn" data-value="*">×</button>

        <button class="btn" data-value="1">1</button>
        <button class="btn" data-value="2">2</button>
        <button class="btn" data-value="3">3</button>
        <button class="btn" data-value="-">−</button>

        <button class="btn" data-value="0">0</button>
        <button class="btn" id="clear">C</button>
        <button class="btn" id="equal">=</button>
        <button class="btn" data-value="+">+</button>
      </div>
    </div>
  </section>

  <section id="tareas">
    <h2>Lista de Tareas</h2>
    <div class="todo-container">
      <input type="text" id="nuevaTarea" placeholder="Escribe una nueva tarea..." />
      <button id="agregarTarea">Agregar</button>
      <ul id="listaTareas"></ul>
    </div>
  </section>

  <script src="app-legacy.js"></script>
</body>
</html>
